server:
  port: 9080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates: 
                - Path=/api/v1/order/**
            - id: product-service
              uri: lb://product-service
              predicates: 
                - Path=/api/v1/product/**
            - id: payment-service
              uri: lb://payment-service
              predicates: 
                - Path=/api/v1/payment/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: TRACE
    org.springframework.cloud.gateway: TRACE
    com.microservices.apigateway: TRACE